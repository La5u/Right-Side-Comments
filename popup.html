<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Comments Sidebar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="row">
      <label for="toggle">Sidebar (ctrl+shift+Y)</label>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="autoExpand">Expand description</label>
      <label class="switch">
        <input type="checkbox" id="autoExpand" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="hideRelated">Hide recommended</label>
      <label class="switch">
        <input type="checkbox" id="hideRelated" />
        <span class="slider"></span>
      </label>
    </div>

    <a
      class="github-link"
      href="https://github.com/La5u/Right-Side-Comments"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="github_logo.png"
        alt="GitHub"
        width="48"
        height="48"
      />
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
