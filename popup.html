<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Comments Sidebar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle theme"
      title="Toggle light/dark theme"
    >
      <img class="theme-icon theme-icon-sun" src="assets/theme-sun.svg" alt="" aria-hidden="true" />
      <img class="theme-icon theme-icon-moon" src="assets/theme-moon.svg" alt="" aria-hidden="true" />
    </button>

    <div class="section-title">Behavior</div>

    <div class="row">
      <label for="toggle" id="toggleLabel">Sidebar (Ctrl+Shift+Y)</label>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="autoExpand">Expand description</label>
      <label class="switch">
        <input type="checkbox" id="autoExpand" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="showRelated">Show recommended</label>
      <label class="switch">
        <input type="checkbox" id="showRelated" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section-title">UI</div>

    <div class="row">
      <label for="showScrollbar">Show scrollbar</label>
      <label class="switch">
        <input type="checkbox" id="showScrollbar" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="compactMargins">Compact comments</label>
      <label class="switch">
        <input type="checkbox" id="compactMargins" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="persistentCommentBox">Persistent comment box</label>
      <label class="switch">
        <input type="checkbox" id="persistentCommentBox" />
        <span class="slider"></span>
      </label>
    </div>

    <a
      class="github-link"
      href="https://github.com/La5u/Right-Side-Comments"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="assets/github_logo.png"
        alt="GitHub"
        width="48"
        height="48"
      />
    </a>
    <div id="versionLabel" class="version-label" aria-label="Extension version"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
