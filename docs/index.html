<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Right Side Comments</title>
  <meta
    name="description"
    content="Move YouTube comments to the right side with quick toggles for recommended videos, scrollbar visibility, and compact layout."
  />
  <link rel="stylesheet" href="./style.css" />
</head>
  <body>
  <header class="banner">
    <img src="icon128.png" alt="Right Side Comments icon" class="logo" />
    <p>YouTube comments in the right sidebar</p>
  </header>

  <main class="container">
    <h1>Right Side Comments</h1>
    <p class="version">Version 2.7</p>
    <p class="lead">Move comments to the right side and keep your watch page clean.</p>

    <div class="actions">
      <a href="https://chromewebstore.google.com/detail/right-side-commments/dbbdaiekbopmfbjdchgggfeabapnacnh" target="_blank" rel="noopener noreferrer">Chrome</a>
      <a href="https://addons.mozilla.org/en-US/firefox/addon/right-side-comments/" target="_blank" rel="noopener noreferrer">Firefox</a>
      <a href="https://github.com/La5u/Right-Side-Comments" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>

    <section>
      <h2>Controls</h2>
      <ul>
        <li>Sidebar toggle</li>
        <li>Expand description</li>
        <li>Show recommended</li>
        <li>Show scrollbar</li>
        <li>Compact comments</li>
      </ul>
    </section>

    <section class="shots">
      <img src="./images/comments.png" alt="Comments on the right" />
      <img src="./images/popup.png" alt="Popup controls" />
    </section>
  </main>

  <footer>
    <small>Right Side Comments • <span id="year"></span></small>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
